<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="https://flyframe.lv/wp-content/uploads/2026/10/cropped-favicon-32x32.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FlyFrame 360° tūre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: full-bleed panorama with the flyframe.lv theme's glass panels — brand + scene top-left, controls top-right, map bottom-left, scene strip bottom.
   Tokens copied from the site theme (theme.css :root). */
:root {
  --bg: #112642;
  --fg: #fff;
  --card: rgba(32, 60, 100, .55);
  --panel: rgba(22, 42, 76, .82);
  --panel-solid: #162b4d;
  --line: rgba(255, 255, 255, .22);
  --acc: #3d8bff;
  --acc2: #2ed3c3;
  --sale1: #ffa53d;
  --muted: rgba(255, 255, 255, .7);
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { position: relative; height: 100%; overflow: hidden; background: var(--bg); user-select: none; -webkit-user-select: none; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl.drag { cursor: grabbing; }
#gl.picking { cursor: crosshair; }
.glass { background: var(--card); backdrop-filter: blur(12px) saturate(1.15); -webkit-backdrop-filter: blur(12px) saturate(1.15); border: 1px solid var(--line); border-radius: 20px; }
.solid { background: var(--panel); }
button { font-family: var(--font); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--acc2); outline-offset: 2px; }

/* ---------- top ---------- */
.top { position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; z-index: 5; }
.top > * { pointer-events: auto; }
.brand { background: var(--panel); display: flex; align-items: center; gap: 14px; padding: 10px 18px 10px 14px; min-width: 0; border-radius: 18px; }
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 22px; line-height: 1; white-space: nowrap; color: var(--fg); text-decoration: none; letter-spacing: -.01em; }
.logo b { color: var(--acc); font-weight: 800; }
.logo .hicon { width: 30px; height: 30px; flex: none; color: #fff; }
.sep { width: 1px; align-self: stretch; background: var(--line); }
.titles { min-width: 0; display: grid; gap: 3px; }
h1 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 8px; align-items: center; }
.badge { flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--acc2); border: 1px solid currentColor; border-radius: 99px; padding: 2px 7px; }
.scene { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.scene b { color: var(--fg); font-weight: 600; }
.ctrls { background: var(--panel); display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 99px; }
.seg { display: flex; gap: 2px; padding-right: 4px; margin-right: 2px; border-right: 1px solid var(--line); }
.seg button, .ib { appearance: none; border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; height: 34px; min-width: 34px; padding: 0 9px; border-radius: 99px; cursor: pointer; display: grid; place-items: center; transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { color: #fff; background: var(--acc); }
.ib[aria-pressed="true"] { color: var(--acc2); }
.seg button:hover, .ib:hover { color: #fff; }
.ib svg { width: 18px; height: 18px; }

/* ---------- hotspots ---------- */
#spots { position: absolute; inset: 0; pointer-events: none; z-index: 3; transition: opacity .3s; }
#spots.hide { opacity: 0; }
.spot { position: absolute; left: 0; top: 0; pointer-events: auto; appearance: none; border: 0; background: none; padding: 0; color: var(--fg); cursor: pointer; display: grid; justify-items: center; gap: 7px; will-change: transform; }
.spot[hidden] { display: none !important; }
.spot .pill { font-size: 12.5px; font-weight: 700; white-space: nowrap; padding: 6px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: border-color .2s; }
.lnk .ring { width: 48px; height: 48px; border-radius: 50%; background: var(--acc); display: grid; place-items: center; box-shadow: 0 0 0 7px rgba(61, 139, 255, .25), 0 8px 22px rgba(0, 0, 0, .3); transition: transform .2s, box-shadow .2s; }
.lnk .ring svg { width: 21px; height: 21px; color: #fff; }
.lnk:hover .ring, .lnk:focus-visible .ring { transform: translateY(-2px) scale(1.06); box-shadow: 0 0 0 9px rgba(61, 139, 255, .3), 0 10px 26px rgba(0, 0, 0, .35); }
.lnk:hover .pill { border-color: var(--acc); }
.inf .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--acc2); color: var(--bg); font: 800 15px/30px var(--font); text-align: center; animation: pulse 2.6s infinite; }
.inf .pill { opacity: 0; transform: translateY(-4px); transition: opacity .2s, transform .2s; }
.inf:hover .pill, .inf:focus-visible .pill { opacity: 1; transform: none; }
.area .pill { font-size: 13px; padding: 8px 14px; border: 1.5px dashed #fff; background: rgba(17, 38, 66, .7); }
.area .pill::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--acc2); margin-right: 8px; vertical-align: 1px; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46, 211, 195, .55); } 70% { box-shadow: 0 0 0 13px rgba(46, 211, 195, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 211, 195, 0); } }

/* ---------- bottom: map + strip ---------- */
.bottom { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; display: flex; align-items: flex-end; gap: 10px; z-index: 4; pointer-events: none; }
.bottom > * { pointer-events: auto; }
#map { position: relative; width: 220px; flex: none; padding: 8px; border-radius: 20px; transition: width .3s ease; }
#map.big { width: min(400px, calc(100vw - 24px)); }
#map.min { width: auto; }
.mhead { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 0 2px 8px 6px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--acc2); }
#map.min .mhead { padding-bottom: 0; }
.mhead .btns { display: flex; gap: 2px; }
.mhead .ib { height: 28px; min-width: 28px; padding: 0; }
.mhead .ib svg { width: 15px; height: 15px; }
.mbox { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 14px; overflow: hidden; background: var(--panel-solid); }
#map.min .mbox { display: none; }
#mapImg { width: 100%; height: 100%; object-fit: cover; display: block; }
#cone { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.north { position: absolute; top: 8px; right: 9px; font-size: 10px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); pointer-events: none; }
.mpt { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; appearance: none; border: 0; padding: 0; background: transparent; cursor: pointer; display: grid; place-items: center; touch-action: manipulation; }
.mpt i { width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--acc2); box-shadow: 0 1px 4px rgba(0, 0, 0, .5); transition: transform .15s, background .15s; }
.mpt:hover i { transform: scale(1.25); }
.mpt[aria-current="true"] { pointer-events: none; }
.mpt[aria-current="true"] i { background: var(--acc); border-color: #fff; width: 16px; height: 16px; }
.mpt span { position: absolute; left: 50%; top: 100%; transform: translate(-50%, -8px); font-size: 11px; font-weight: 700; white-space: nowrap; padding: 3px 8px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); opacity: 0; pointer-events: none; transition: opacity .15s; }
.mpt:hover span, #map.big .mpt span { opacity: 1; }
#strip { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; padding: 8px; border-radius: 20px; scrollbar-width: none; justify-content: safe center; }
#strip::-webkit-scrollbar { display: none; }
.th { appearance: none; flex: none; width: 122px; border: 1.5px solid transparent; border-radius: 14px; padding: 0; background: rgba(17, 38, 66, .55); color: var(--muted); cursor: pointer; overflow: hidden; text-align: left; transition: border-color .2s, color .2s, transform .2s; }
.th:hover { transform: translateY(-2px); }
.th img { width: 100%; aspect-ratio: 8 / 5; object-fit: cover; display: block; opacity: .85; transition: opacity .2s; }
.th span { display: block; font-size: 11.5px; font-weight: 600; padding: 6px 9px 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.th:hover img, .th[aria-current="true"] img { opacity: 1; }
.th[aria-current="true"] { border-color: var(--acc); color: #fff; }

/* ---------- info card ---------- */
#card { position: absolute; z-index: 6; left: 50%; bottom: 160px; transform: translateX(-50%); width: min(360px, calc(100% - 32px)); padding: 18px 20px 20px; display: grid; gap: 6px; background: var(--panel); }
#card h2 { margin: 0; font-size: 17px; font-weight: 700; padding-right: 30px; text-wrap: balance; }
#card p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--muted); }
#card .k { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--acc2); }
#card .x { position: absolute; top: 10px; right: 10px; }

/* ---------- loader (start) + veil (between scenes) ---------- */
#loader, #veil { position: absolute; inset: 0; display: grid; place-items: center; }
#loader { z-index: 9; background: radial-gradient(120% 90% at 50% 40%, #1b3a66 0%, var(--bg) 60%); transition: opacity .6s; }
#loader.done { opacity: 0; pointer-events: none; }
#veil { z-index: 3; background: rgba(17, 38, 66, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .28s ease; }
#veil.on { opacity: 1; pointer-events: auto; }
.ld { display: grid; justify-items: center; gap: 14px; }
.ld .logo { font-size: 30px; gap: 12px; }
.ld .logo .hicon { width: 46px; height: 46px; }
.ld .lt { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.bar { width: 180px; height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--acc), var(--acc2)); transition: width .25s; }
/* plane loop: the same flight as the old booking form (smoothLoop), drawn along a smooth path */
.flight-track { width: 256px; height: 128px; position: relative; }
#loader .flight-track { margin-top: 24px; }
.airplane-animation { position: absolute; left: 0; top: 0; width: 32px; height: 32px; margin: -16px 0 0 -16px;
  offset-path: path("M0 96 L96 96 C124.8 96 140.8 64 134.4 41.6 C129.6 22.4 115.2 12.8 104 12.8 C89.6 12.8 73.6 28.8 72 51.2 C70.4 73.6 89.6 96 115.2 96 L256 96");
  offset-rotate: auto 45deg; animation: smoothLoop 2.5s infinite linear; }
.airplane-animation svg { width: 100%; height: 100%; display: block; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.loading-text { margin: 5px 0 0; font-size: 14px; font-weight: 700; color: rgba(255, 255, 255, .62); margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }
@keyframes smoothLoop {
  0% { offset-distance: 0%; opacity: 0; }
  10% { offset-distance: 9.96%; opacity: 1; }
  20% { offset-distance: 19.92%; }
  25% { offset-distance: 26.42%; }
  30% { offset-distance: 32.72%; }
  35% { offset-distance: 38.16%; }
  40% { offset-distance: 43.23%; }
  45% { offset-distance: 44.39%; }
  50% { offset-distance: 45.07%; }
  55% { offset-distance: 45.75%; }
  60% { offset-distance: 46.9%; }
  65% { offset-distance: 51.95%; }
  70% { offset-distance: 57.37%; }
  75% { offset-distance: 63.76%; }
  80% { offset-distance: 70.12%; }
  85% { offset-distance: 76.78%; }
  90% { offset-distance: 86.71%; opacity: 1; }
  100% { offset-distance: 100%; opacity: 0; }
}


#hint { position: absolute; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 11px 16px; font-size: 13.5px; font-weight: 600; display: flex; gap: 10px; align-items: center; transition: opacity .6s; pointer-events: none; border-radius: 99px; background: var(--panel); }
#hint.off { opacity: 0; }
#hint svg { width: 22px; height: 22px; color: var(--acc2); }
.credit { position: absolute; z-index: 4; right: max(16px, env(safe-area-inset-right, 0px)); top: 66px; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); text-decoration: none; }
.credit:hover { color: var(--acc2); }
#nogl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; z-index: 10; background: var(--bg); }

/* ---------- edit mode ---------- */
#edit { position: absolute; z-index: 8; right: max(12px, env(safe-area-inset-right, 0px)); top: 100px; width: 320px; max-height: calc(100% - 250px); overflow: auto; padding: 12px 14px 0; font-size: 12.5px; line-height: 1.45; background: var(--panel); border-radius: 18px; }
#edit.min #edBody { display: none; }
#edit.min { padding-bottom: 8px; }
.ehead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.ehead .k { color: var(--sale1); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: 11px; }
.ehead .ib { height: 26px; min-width: 26px; }
#edBody { display: grid; gap: 8px; }
.etabs { display: flex; gap: 4px; }
.etabs button, #edBody .erow button { appearance: none; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: #fff; border-radius: 99px; padding: 6px 10px; font: 700 12px/1.2 var(--font); cursor: pointer; }
.etabs button[aria-pressed="true"], #edBody button[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); }
#edBody button.pri { background: var(--acc); border-color: var(--acc); }
.erow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.erow select { flex: 1; min-width: 0; }
.erow.sticky { position: sticky; bottom: 0; background: var(--panel-solid); margin: 4px -14px 0; padding: 10px 14px 12px; border-top: 1px solid var(--line); }
.eh { font-weight: 700; font-size: 14px; }
.eh small, .eitem small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }
.ek { margin-top: 6px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--acc2); }
.ef { display: grid; gap: 4px; }
.el { font-size: 11px; font-weight: 700; color: var(--muted); }
#edBody input:not([type]), #edBody input[type="text"], #edBody textarea, #edBody select { width: 100%; box-sizing: border-box; background: rgba(0, 0, 0, .25); color: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: 500 12.5px/1.35 var(--font); }
#edBody textarea { resize: vertical; }
#edBody input:focus, #edBody textarea:focus, #edBody select:focus { outline: none; border-color: var(--acc); }
.eitem { display: flex; align-items: center; gap: 4px; padding: 5px 6px 5px 10px; border-radius: 10px; background: rgba(255, 255, 255, .05); }
.eitem.on { outline: 1px solid var(--acc); }
.eitem span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.eitem button { appearance: none; border: 0; background: transparent; color: var(--muted); width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font: 700 13px/1 var(--font); flex: none; }
.eitem button:hover { color: #fff; background: rgba(255, 255, 255, .1); }
.eform { display: grid; gap: 8px; padding: 10px; border-radius: 12px; background: rgba(0, 0, 0, .2); }
.eform label, .eck { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; }
.enote { color: var(--muted); font-size: 11.5px; }
.estat { color: var(--sale1); font-size: 12px; font-weight: 600; min-height: 1.4em; }
#gl.placing { cursor: copy; }
#cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; z-index: 3; pointer-events: none; }

@media (max-width: 640px) {
  .brand { padding: 8px 14px 8px 12px; gap: 10px; }
  .logo { font-size: 18px; }
  .top { flex-direction: column; align-items: stretch; }
  .ctrls { align-self: flex-end; }
  .ctrls .fs { display: none; }
  .credit { top: auto; bottom: 118px; }
  #map:not(.big):not(.min) { width: 150px; }
  #map.big { position: fixed; left: 12px; right: 12px; bottom: 12px; width: auto; z-index: 8; }
  .th { width: 96px; }
  .th span { font-size: 10.5px; }
  #card { bottom: 128px; }
  #edit { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; max-height: 55%; }
}
@media (prefers-reduced-motion: reduce) {
  .inf .dot { animation: none; }
  .airplane-animation { animation-duration: 4s; }
}
</style>
</head>

<script>
(() => {
  "use strict";
  const UI = {

    lt: { loading: "Įkeliama panorama...", map: "Žemėlapis", big: "Padidinti žemėlapį", small: "Sumažinti žemėlapį", hide: "Slėpti žemėlapį", show: "Rodyti žemėlapį", rot: "Automatinis sukimas", fs: "Visas ekranas", close: "Uždaryti", hint: "Tempkite, kad apsižvalgytumėte", info: "Informacija", area: "Sklypas", fail: "Nepavyko įkelti turo.", nogl: "Ši naršyklė nepalaiko WebGL, todėl 360° vaizdo parodyti negalima.", dirs: ["Š", "ŠR", "R", "PR", "P", "PV", "V", "ŠV"] }
  };
  const $ = (s) => document.querySelector(s);
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const phone = () => innerWidth <= 640;
  const EDIT = location.hash === "#edit";
  const D2R = Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const wrap = (a) => ((a + 180) % 360 + 360) % 360 - 180;
  const easeInOut = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  let lang = ["lv", "ru", "lt"].includes(store.get("ff-lang")) ? store.get("ff-lang") : "lv";

  // the same flight animation is reused for the between-scenes veil
  (() => { const w = document.createElement("div"); w.className = "ld"; const t = $("#flightTpl").cloneNode(true); t.removeAttribute("id"); const p = document.createElement("p"); p.className = "loading-text"; p.id = "vT"; w.append(t, p); $("#veil").appendChild(w); })();

  // ---------- WebGL ----------
  const canvas = $("#gl");
  const gl = canvas.getContext("webgl", { antialias: false, alpha: false });
  if (!gl) {
    const d = document.createElement("div"); d.id = "nogl"; d.textContent = UI[lang].nogl; $("#app").appendChild(d); $("#loader").classList.add("done"); return;
  }
  const MAXTEX = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), 4096);
  const aniso = gl.getExtension("EXT_texture_filter_anisotropic") || gl.getExtension("WEBKIT_EXT_texture_filter_anisotropic");
  const VS = "attribute vec3 p; attribute vec2 uv; uniform mat4 m; varying vec2 v; void main(){ v = uv; gl_Position = m * vec4(p, 1.0); }";
  const FS = "precision mediump float; varying vec2 v; uniform sampler2D a; void main(){ gl_FragColor = vec4(texture2D(a, v).rgb, 1.0); }";
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
  const U = { m: gl.getUniformLocation(prog, "m"), a: gl.getUniformLocation(prog, "a") };

  // sphere seen from inside; x east, y up, -z forward at yaw 0; u = 0.5 + yaw/360
  const SPH = (() => {
    const LON = 96, LAT = 48, pos = [], uvs = [], idx = [];
    for (let j = 0; j <= LAT; j++) {
      const pt = (0.5 - j / LAT) * Math.PI;
      for (let i = 0; i <= LON; i++) {
        const yw = (i / LON - 0.5) * 2 * Math.PI;
        pos.push(Math.cos(pt) * Math.sin(yw), Math.sin(pt), -Math.cos(pt) * Math.cos(yw));
        uvs.push(i / LON, j / LAT);
      }
    }
    for (let j = 0; j < LAT; j++) for (let i = 0; i < LON; i++) { const a = j * (LON + 1) + i, b = a + LON + 1; idx.push(a, b, a + 1, a + 1, b, b + 1); }
    const buf = (data, loc, n) => { const bo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bo); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW); const l = gl.getAttribLocation(prog, loc); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, n, gl.FLOAT, false, 0, 0); };
    buf(pos, "p", 3); buf(uvs, "uv", 2);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
    return { count: idx.length };
  })();

  function makeTex(img) {
    // power-of-two 2:1 texture that fits the device, so mipmaps and wrapping work on every phone
    let w = 1; while (w * 2 <= Math.min(img.naturalWidth, MAXTEX)) w *= 2;
    const h = w / 2;
    let src = img;
    if (img.naturalWidth !== w || img.naturalHeight !== h) {
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(img, 0, 0, w, h); src = c;
    }
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
    return t;
  }

  // ---------- camera ----------
  const BASE_FOV = 95;
  const cam = { yaw: 0, pitch: 0, hfov: BASE_FOV, vy: 0, vp: 0 };
  let W = 1, H = 1, dirty = true;
  function vfov() { return clamp(2 * Math.atan(Math.tan(cam.hfov * D2R / 2) / (W / H)) / D2R, 30, 105); }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height); dirty = true;
  }
  function toView(x, y, z) {
    const a = cam.yaw * D2R, b = -cam.pitch * D2R;
    const x1 = x * Math.cos(a) + z * Math.sin(a), z1 = -x * Math.sin(a) + z * Math.cos(a);
    return [x1, y * Math.cos(b) - z1 * Math.sin(b), y * Math.sin(b) + z1 * Math.cos(b)];
  }
  function dir(yaw, pitch) { const y = yaw * D2R, p = pitch * D2R; return [Math.cos(p) * Math.sin(y), Math.sin(p), -Math.cos(p) * Math.cos(y)]; }
  function project(yaw, pitch) {
    const v = toView(...dir(yaw, pitch));
    if (v[2] > -0.05) return null;
    const f = 1 / Math.tan(vfov() * D2R / 2);
    return [((f / (W / H)) * v[0] / -v[2] + 1) / 2 * W, (1 - f * v[1] / -v[2]) / 2 * H];
  }
  function unproject(sx, sy) {
    const f = 1 / Math.tan(vfov() * D2R / 2);
    const x = ((sx / W) * 2 - 1) * (W / H) / f, y = (1 - (sy / H) * 2) / f, z = -1;
    const b = cam.pitch * D2R, y1 = y * Math.cos(b) - z * Math.sin(b), z1 = y * Math.sin(b) + z * Math.cos(b);
    const a = -cam.yaw * D2R, x2 = x * Math.cos(a) + z1 * Math.sin(a), z2 = -x * Math.sin(a) + z1 * Math.cos(a);

    const f = 1 / Math.tan(vfov() * D2R / 2), a = W / H, n = 0.1, fa = 10;
    const P = [f / a, 0, 0, 0, 0, f, 0, 0, 0, 0, (fa + n) / (n - fa), -1, 0, 0, 2 * fa * n / (n - fa), 0];
    const cy = Math.cos(cam.yaw * D2R), sy = Math.sin(cam.yaw * D2R), cp = Math.cos(-cam.pitch * D2R), sp = Math.sin(-cam.pitch * D2R);
    const R = [[cy, 0, sy], [sp * sy, cp, -sp * cy], [-cp * sy, sp, cp * cy]];
    const M = [R[0][0], R[1][0], R[2][0], 0, R[0][1], R[1][1], R[2][1], 0, R[0][2], R[1][2], R[2][2], 0, 0, 0, 0, 1];

  const imgCache = {};
  function loadImg(src) {

        const i = new Image();
        i.onload = () => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()).then(() => res(i));

  }

  const spotsEl = $("#spots");
  let spotEls = [];
  const ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>';
  const ICON_DRONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7 8l3 3M17 8l-3 3M7 16l3-3M17 16l-3-3"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg>';
  function buildSpots() {
    spotsEl.innerHTML = ""; spotEls = [];
    if (!cur) return;
    for (const l of cur.links || []) {
      const t = byId[l.to]; if (!t) continue;
      const b = document.createElement("button");
      b.className = "spot lnk";

    return JSON.stringify(out, null, 1);
  }
  $("#edMin").addEventListener("click", () => { ed.classList.toggle("min"); $("#edMin").textContent = ed.classList.contains("min") ? "+" : "—"; });
  if (EDIT) {
    ed.hidden = false; $("#cross").removeAttribute("hidden"); canvas.classList.add("picking"); setRot(false);
    ed.addEventListener("input", (e) => {
      const p = e.target.dataset.path;
      if (p) { setPath(p, e.target.value); edSave(); if (p.startsWith("tour.map")) buildMap(); else { buildStrip(); buildSpots(); markStrip(); placeSpots(); updateScene(); $("#title").textContent = T(cfg.title); $("#badge").textContent = T(cfg.badge); $("#badge").hidden = !T(cfg.badge); } }
      if (e.target.name === "edKind" && edSpot) { edSpot.kind = e.target.value; edChanged(); }
      if (e.target.id === "edStart") { cfg.start = e.target.value; edSave(); }
    });
    ed.addEventListener("click", async (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.tab) { ed.dataset.tab = b.dataset.tab; edRender(); return; }
      const act = b.dataset.act, i = +b.dataset.i;
      if (act === "start") { cur.start = { yaw: +cam.yaw.toFixed(1), pitch: +cam.pitch.toFixed(1) }; edChanged(); edStatus("Стартовый вид сохранён"); }
      if (act === "north") { cur.heading = +wrap(cam.yaw).toFixed(1); edChanged(); edStatus("Север задан: на карте конус обзора теперь смотрит правильно"); }
      if (act === "map") { edMode = edMode === "map" ? null : "map"; edRender(); }
      if (act === "thumb") {
        draw();
        const c = document.createElement("canvas"); c.width = 480; c.height = 300;
        const sw = canvas.width, sh = canvas.height, k = Math.min(sw / 480, sh / 300);
        c.getContext("2d").drawImage(canvas, (sw - 480 * k) / 2, (sh - 300 * k) / 2, 480 * k, 300 * k, 0, 0, 480, 300);
        c.toBlob((blob) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = cur.id + "-t.jpg"; document.body.appendChild(a); a.click(); a.remove(); }, "image/jpeg", 0.86);
        cur.thumb = "tour/" + cur.id + "-t.jpg"; edChanged();
        edStatus(`Скачан файл ${cur.id}-t.jpg — положите его в папку tour`);
      }
      if (act === "addlink") { edMode = "link"; edTarget = $("#edLinkTo").value; canvas.classList.add("placing"); edRender(); }
      if (act === "dellink") { cur.links.splice(i, 1); edChanged(); edRender(); }
      if (act === "mvlink") { edMode = "move"; edTarget = cur.links[i]; canvas.classList.add("placing"); edRender(); }
      if (act === "addspot") { edMode = "spot"; canvas.classList.add("placing"); edRender(); }
      if (act === "editspot") { edSpot = cur.spots[i]; edRender(); turnTo(edSpot.yaw, clamp(edSpot.pitch, -60, 60), 500); }
      if (act === "mvspot") { edMode = "move"; edTarget = cur.spots[i]; canvas.classList.add("placing"); edRender(); }
      if (act === "delspot") { if (edSpot === cur.spots[i]) edSpot = null; cur.spots.splice(i, 1); edChanged(); edRender(); }
      if (act === "closespot") { edSpot = null; edChanged(); edRender(); }
      if (act === "open") { edSpot = null; await go(cfg.nodes[i].id); edRender(); }
      if (act === "delnode") {
        const n = cfg.nodes[i];
        if (n === cur) { edStatus("Сначала откройте другую точку, потом удаляйте эту"); return; }
        if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Да?"; edStatus(`Нажмите «Да?» ещё раз, чтобы удалить «${T(n.name)}» и все переходы на неё`); return; }
        cfg.nodes.splice(i, 1); cfg.nodes.forEach((m) => m.links = (m.links || []).filter((l) => l.to !== n.id));
        if (cfg.start === n.id) cfg.start = cfg.nodes[0].id;
        edChanged(); edRender(); edStatus("Точка удалена");
      }
      if (act === "addnode") {
        const id = ($("#edNewId").value || "").trim().toLowerCase().replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "");
        if (!id) { edStatus("Укажите id латиницей"); return; }
        if (byId[id]) { edStatus("Точка с таким id уже есть"); return; }
        cfg.nodes.push({ id, name: { lv: id, ru: id, lt: id }, pano: `tour/${id}.jpg`, thumb: "", heading: 0, start: { yaw: 0, pitch: 0 }, map: null, aerial: $("#edNewAir").checked, links: [], spots: [] });
        edChanged(); edRender(); edStatus(`Точка «${id}» добавлена. Загрузите tour/${id}.jpg и откройте её кнопкой ↗`);
      }
      if (act === "download") { download("tour.json", exportJSON(), "application/json"); edStatus("tour.json скачан — замените им файл в папке tour"); }
      if (act === "copy") {
        const txt = exportJSON();
        try { await navigator.clipboard.writeText(txt); edStatus("tour.json скопирован в буфер обмена"); }
        catch (err) { edStatus("Копирование недоступно — используйте «Скачать tour.json»"); }
      }
      if (act === "reset") {
        if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Точно?"; edStatus("Черновик будет удалён, страница перезагрузится с файлом tour.json"); return; }
        try { localStorage.removeItem(DRAFT); } catch (err) {}
        location.reload();
      }
    });
    mbox.addEventListener("click", (e) => {
      const r = mbox.getBoundingClientRect();
      const x = +((e.clientX - r.left) / r.width).toFixed(4), y = +((e.clientY - r.top) / r.height).toFixed(4);
      if (edMode === "map" && cur) { cur.map = [x, y]; edDone("Место точки на карте сохранено"); }
      else edStatus(`Точка на карте: ${x}, ${y}`);
    });
  }

  // ---------- loop ----------
  let lastT = performance.now(), lastScene = "";
  function frame(now) {
    const dt = Math.min(now - lastT, 50); lastT = now;
    if (tweens.length) {
      tweens = tweens.filter((tw) => { const k = clamp((now - tw.t0) / tw.ms, 0, 1); tw.fn(k); if (k === 1) { tw.res(); return false; } return true; });
      dirty = true;
    }
    if (!busy && !ptrs.size && (Math.abs(cam.vy) > 0.01 || Math.abs(cam.vp) > 0.01)) {
      cam.yaw += cam.vy * dt / 16; cam.pitch = clamp(cam.pitch + cam.vp * dt / 16, -88, 88);
      const d = Math.pow(0.9, dt / 16); cam.vy *= d; cam.vp *= d; dirty = true;
    }
    if (rotOn && !busy && !ptrs.size && card.hidden && now - idleSince > 3500 && tex) { cam.yaw += dt * 0.004; dirty = true; }
    if (dirty) {
      dirty = false; draw(); placeSpots(); placeCone();
      const s = cam.yaw.toFixed(0) + "|" + cam.pitch.toFixed(1);
      if (s !== lastScene) { lastScene = s; updateScene(); }
    }
    requestAnimationFrame(frame);
  }

  // ---------- boot ----------
  addEventListener("resize", resize);
  resize();
  setMap(store.get("ff-map") === "min" || phone() ? "min" : "normal");
  applyLang();
  const t0 = performance.now();
  fetch("tour/tour.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(async (c) => {
    if (EDIT) { try { const d = JSON.parse(localStorage.getItem(DRAFT) || "null"); if (d && d.nodes) { c = d; edStatus("Открыт сохранённый черновик. «Сброс» вернёт файл tour.json."); } } catch (e) {} }
    cfg = c; c.nodes.forEach((n) => byId[n.id] = n);
    applyLang();
    const start = byId[location.hash.slice(1)] || byId[c.start] || c.nodes[0];
    const img = await loadImg(start.pano);
    await sleep(Math.max(0, 1200 - (performance.now() - t0)));
    tex = makeTex(img); cur = start;
    if (start.start) { cam.yaw = start.start.yaw; cam.pitch = start.start.pitch; }
    cam.hfov = BASE_FOV - 12;
    buildSpots(); markStrip(); markMap(); updateScene(); dirty = true;
    $("#loader").classList.add("done");
    tween(1400, (k) => { cam.hfov = BASE_FOV - 12 + 12 * easeOut(k); });
    if (!EDIT) { $("#hint").classList.remove("off"); setTimeout(() => $("#hint").classList.add("off"), 3200); }
    if (EDIT) edRender();
    idleSince = performance.now();
    preload();
  }).catch((err) => { console.error(err); $("#ldT").textContent = UI[lang].fail; document.querySelector("#loader .flight-track").hidden = true; });
  requestAnimationFrame(frame);
})();
</script>

</body>
